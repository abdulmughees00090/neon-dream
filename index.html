  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      cursor: none;
      font-family: 'Georgia', serif;
    }

    /* Show real cursor on overlays and interactive elements */
    #tutorial,
    #pay-overlay,
    #tutorial *,
    #pay-overlay * {
      cursor: auto !important;
    }
    #tutorial .tut-btn,
    #pay-overlay button,
    #pay-overlay .pay-amount-btn,
    #pay-overlay .pay-confirm-btn,
    #pay-overlay .pay-close {
      cursor: pointer !important;
    }
    #mute-btn,
    #footer-links a {
      cursor: pointer !important;
    }

    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
      z-index: 0;
    }

    /* ── Custom cursor dot (hidden on overlays via body rule) ── */
    #cursor-dot {
      position: fixed;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #fff;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 30;
      box-shadow: 0 0 6px 2px rgba(255,255,255,0.8);
      transition: background 0.3s, box-shadow 0.3s;
    }

    /* ── Tutorial overlay ── */
    #tutorial {
      position: fixed;
      inset: 0;
      background: rgba(3,3,3,0.94);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: tutFadeIn 1.2s ease forwards;
    }
    #tutorial.hiding {
      animation: tutFadeOut 1s ease forwards;
      pointer-events: none;
    }
    @keyframes tutFadeIn  { from { opacity:0 } to { opacity:1 } }
    @keyframes tutFadeOut { from { opacity:1 } to { opacity:0 } }
    @keyframes fadeIn     { from { opacity:0; transform: translateY(6px) } to { opacity:1; transform: translateY(0) } }

    .tut-inner {
      max-width: 480px;
      width: 88%;
      text-align: center;
      padding: 48px 36px 52px;
      border-radius: 4px;
      background: rgba(6,6,6,0.85);
      backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
    }
    .tut-inner::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 5px;
      background: conic-gradient(from 0deg, #ff00cc, #00ffee, #ffe566, #ff6600, #cc00ff, #ff00cc);
      z-index: -1;
      animation: spinBorder 6s linear infinite;
      opacity: 0.5;
    }
    .tut-inner::after {
      content: '';
      position: absolute;
      inset: 1px;
      border-radius: 4px;
      background: rgba(4,4,4,0.97);
      z-index: -1;
    }
    @keyframes spinBorder { to { transform: rotate(360deg); } }

    .tut-glyph {
      font-size: 1.8rem;
      margin-bottom: 24px;
      display: block;
      color: rgba(255,255,255,0.15);
      letter-spacing: 0.6em;
      animation: glyphFade 3s ease-in-out infinite;
    }
    @keyframes glyphFade {
      0%,100% { opacity: 0.15; }
      50%      { opacity: 0.55; }
    }

    .tut-line1 {
      font-family: 'Georgia', serif;
      font-size: clamp(1rem, 3vw, 1.45rem);
      font-weight: 400;
      font-style: italic;
      color: rgba(255,255,255,0.7);
      margin-bottom: 10px;
      line-height: 1.75;
    }
    .tut-line2 {
      font-family: Arial, sans-serif;
      font-size: clamp(0.72rem, 1.8vw, 0.88rem);
      color: rgba(255,255,255,0.28);
      margin-bottom: 40px;
      letter-spacing: 0.1em;
    }

    .tut-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.55);
      padding: 13px 44px;
      border-radius: 40px;
      font-family: 'Georgia', serif;
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      position: relative;
      overflow: hidden;
      transition: border-color 0.4s, color 0.4s, box-shadow 0.4s;
    }
    .tut-btn:hover {
      border-color: rgba(0,255,238,0.5);
      color: rgba(255,255,255,0.88);
      box-shadow: 0 0 20px rgba(0,255,238,0.15);
    }

    /* ── Payment entity / phrase button (dynamic, JS-placed) ── */
    #pay-entity-dyn {
      position: fixed;
      font-family: 'Georgia', serif;
      font-size: clamp(0.68rem, 1.55vw, 0.92rem);
      font-weight: 400;
      font-style: italic;
      letter-spacing: 0.06em;
      text-transform: none;
      color: rgba(255,255,255,0.28);
      z-index: 12;
      user-select: none;
      padding: 12px 26px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 40px;
      transform: translate(-50%, -50%) scale(1);
      /* Fast polished appearance + smooth phrase-change transform */
      transition: opacity 0.8s ease,
                  transform 0.75s cubic-bezier(0.34, 1.56, 0.64, 1),
                  color 0.4s ease,
                  border-color 0.4s ease,
                  box-shadow 0.4s ease;
      opacity: 0;
      pointer-events: none;
      white-space: normal;
      word-break: break-word;
      text-align: center;
      line-height: 1.55;
      cursor: pointer !important;
      max-width: min(72vw, 380px);
    }

    /* ── Payment overlay ── */
    #pay-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(10px);
    }
    #pay-overlay.open { display: flex; }
    .pay-modal {
      max-width: 400px;
      width: 90%;
      background: rgba(5,5,5,0.97);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px;

      text-align: center;
      position: relative;
    }
    .pay-modal::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 5px;
      background: conic-gradient(from 0deg, #0ff, #f0f, #ff0, #0ff);
      z-index: -1;

    }
    .pay-modal::after {
      content: '';

    .pay-title {

      font-size: 0.88rem;

    }
    .pay-confirm-btn:hover {
      border-color: rgba(0,200,255,0.85);
      box-shadow: 0 0 24px rgba(0,200,255,0.28);
      color: #fff;
    }
    .pay-close {
      font-family: Arial, sans-serif;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.14);
      letter-spacing: 0.14em;
      background: none;
      border: none;
      transition: color 0.3s;
    }
    .pay-close:hover { color: rgba(255,255,255,0.4); }

    /* ── Mute button ── */
    #mute-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 50;
      background: none;
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.2);
      font-family: Arial, sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      padding: 7px 14px;
      border-radius: 40px;
      transition: all 0.3s;
    }
    #mute-btn:hover {
      border-color: rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.5);
    }

    /* ── Footer links ── */
    #footer-links {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    #footer-links a {
      background: none;
      border: 1px solid rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.18);
      font-family: Arial, sans-serif;
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      padding: 5px 10px;
      border-radius: 40px;
      text-decoration: none;
      transition: all 0.3s;
    }
    #footer-links a:hover {
      border-color: rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.5);
    }

    /* ── Session glyph ── */
    #session-glyph {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 50;
      color: rgba(255,255,255,0.04);
      font-size: 0.58rem;
      letter-spacing: 0.22em;
      font-family: 'Georgia', serif;
      pointer-events: none;
      transition: color 2s ease;
    }

    /* ── Mobile (≤480px) ── */
    @media (max-width: 480px) {
      .tut-inner          { padding: 36px 24px 40px; }
      .pay-modal          { padding: 36px 24px 40px; }
      #footer-links       { bottom: 56px; }
      #mute-btn           { bottom: 20px; right: 12px; }
      #session-glyph      { display: none; }
      #pay-entity-dyn     { max-width: 82vw; font-size: clamp(0.7rem, 3.8vw, 0.88rem); padding: 10px 20px; }
    }

    /* ── Tablet (481px – 768px) ── */
    @media (max-width: 768px) and (min-width: 481px) {
      #pay-entity-dyn     { max-width: 68vw; }
      .pay-modal          { max-width: 380px; }
    }

    /* ── Landscape phones (short viewport) ── */
    @media (max-height: 480px) {
      #footer-links       { display: none; }
      #mute-btn           { bottom: 8px; right: 8px; padding: 5px 10px; }
      #session-glyph      { display: none; }
    }

    /* ── Large / 4K screens (≥1600px) ── */
    @media (min-width: 1600px) {
      #pay-entity-dyn     { font-size: clamp(0.82rem, 0.85vw, 1.05rem); padding: 14px 32px; max-width: min(60vw, 500px); }
      .tut-inner          { max-width: 540px; }
      .pay-modal          { max-width: 460px; }
    }
  </style>

<script>
(function () {
  'use strict';

  /* ═══════════════════════════════════
     TUTORIAL
  ═══════════════════════════════════ */
  const STORAGE_KEY = 'neonDream_v4';
  const tutEl  = document.getElementById('tutorial');
  const tutBtn = document.getElementById('tut-enter');

  // Hide custom cursor dot when over overlays
  const cursorDot = document.getElementById('cursor-dot');

  function hideTutorial() {
    tutEl.classList.add('hiding');
    setTimeout(() => { tutEl.style.display = 'none'; startAudio(); }, 1000);
    try { localStorage.setItem(STORAGE_KEY, '1'); } catch(_){}
  }
  tutBtn.addEventListener('click', hideTutorial);
  try { if (localStorage.getItem(STORAGE_KEY)) { setTimeout(hideTutorial, 400); } } catch(_){}

  /* ═══════════════════════════════════
     CANVAS
  ═══════════════════════════════════ */
  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');
  let W, H;
  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', () => { resize(); });

  /* ═══════════════════════════════════
     POINTER TRACKING
  ═══════════════════════════════════ */
  let mx = W / 2, my = H / 2;
  let pmx = mx, pmy = my;
  let pointerSpeed = 0;
  let isTouch = false;

  function onPointerMove(cx, cy) {
    pmx = mx; pmy = my;
    mx = cx; my = cy;
    pointerSpeed = Math.hypot(mx - pmx, my - pmy);
    cursorDot.style.left = mx + 'px';
    cursorDot.style.top  = my + 'px';
  }

  window.addEventListener('mousemove', e => {
    isTouch = false;
    onPointerMove(e.clientX, e.clientY);
    // Hide dot when over an overlay
    const overOverlay = tutEl.style.display !== 'none' && tutEl.offsetParent !== null
      || document.getElementById('pay-overlay').classList.contains('open');
    cursorDot.style.opacity = overOverlay ? '0' : '1';
  });
  window.addEventListener('touchmove', e => {
    isTouch = true;
    if (!document.getElementById('pay-overlay').classList.contains('open')) {
      e.preventDefault();
    }
    const t = e.touches[0];
    onPointerMove(t.clientX, t.clientY);
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    isTouch = true;
    const t = e.touches[0];
    onPointerMove(t.clientX, t.clientY);
  }, { passive: true });

  /* On touch devices, hide the fake cursor dot */
  if ('ontouchstart' in window) cursorDot.style.display = 'none';

  /* ═══════════════════════════════════
     SESSION DURATION
  ═══════════════════════════════════ */
  const sessionStart = Date.now();
  function sessionMinutes() { return (Date.now() - sessionStart) / 60000; }
  function sessionIntensity() { return Math.min(1, sessionMinutes() / 10); }

  /* ═══════════════════════════════════
     ORB SYSTEM
  ═══════════════════════════════════ */
  const TRAIL_LEN    = 52;
  const N_ORBS       = 8;
  const SPAWN_SPREAD = 200;

  function randHue() { return Math.random() * 360; }

  class Orb {
    constructor() { this.reset(true); }
    reset(first = false) {
      this.x = first ? Math.random() * W : mx + (Math.random() - 0.5) * SPAWN_SPREAD;
      this.y = first ? Math.random() * H : my + (Math.random() - 0.5) * SPAWN_SPREAD;
      this.hue         = randHue();
      this.hueSpeed    = (Math.random() - 0.5) * 1.4;
      this.size        = 3 + Math.random() * 6;
      this.speed       = 0.028 + Math.random() * 0.042;
      this.wander      = Math.random() * Math.PI * 2;
      this.wanderSpeed = (Math.random() - 0.5) * 0.08;
      this.wanderAmp   = 70 + Math.random() * 140;
      this.trail = [];
      for (let i = 0; i < TRAIL_LEN; i++) this.trail.push({ x: this.x, y: this.y });
    }
    update(energyBoost) {
      this.wander += this.wanderSpeed;
      const amp = this.wanderAmp * (1 + energyBoost * 1.4);
      const tx = mx + Math.cos(this.wander)       * amp * 0.5;
      const ty = my + Math.sin(this.wander * 1.3) * amp * 0.4;
      const spd = this.speed * (1 + energyBoost * 0.8);
      this.x += (tx - this.x) * spd;
      this.y += (ty - this.y) * spd;
      this.hue = (this.hue + this.hueSpeed + 360) % 360;
      this.trail.unshift({ x: this.x, y: this.y });
      if (this.trail.length > TRAIL_LEN) this.trail.pop();
    }
    draw(energyBoost) {
      const h    = this.hue;
      const blur = 18 + energyBoost * 24;
      for (let i = 1; i < this.trail.length; i++) {
        const t   = (this.trail.length - i) / this.trail.length;
        const seg = this.trail[i];
        ctx.save();
        ctx.beginPath();
        ctx.arc(seg.x, seg.y, Math.max(0.1, this.size * t * 0.9), 0, Math.PI * 2);
        ctx.fillStyle   = `hsla(${h},100%,60%,${t * t * 0.9})`;
        ctx.shadowColor = `hsl(${h},100%,55%)`;
        ctx.shadowBlur  = blur * t;
        ctx.fill();
        ctx.restore();
      }
      const r = this.size * (3.5 + energyBoost * 2);
      const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
      g.addColorStop(0,   `hsla(${h},100%,90%,1)`);
      g.addColorStop(0.3, `hsla(${h},100%,60%,0.7)`);
      g.addColorStop(1,   `hsla(${h},100%,50%,0)`);
      ctx.save();
      ctx.beginPath();
      ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
      ctx.fillStyle   = g;
      ctx.shadowColor = `hsl(${h},100%,60%)`;
      ctx.shadowBlur  = 30 + energyBoost * 40;
      ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * 0.5, 0, Math.PI * 2);
      ctx.fillStyle   = '#fff';
      ctx.shadowColor = '#fff';
      ctx.shadowBlur  = 14;
      ctx.fill();
      ctx.restore();
    }
  }

  const orbs = Array.from({ length: N_ORBS }, () => new Orb());

  /* ═══════════════════════════════════
     SPARKLES
  ═══════════════════════════════════ */
  const sparkles = Array.from({ length: 60 }, () => ({
    x:     Math.random() * 1920,
    y:     Math.random() * 1080,
    hue:   randHue(),
    alpha: Math.random() * 0.3 + 0.03,
    speed: (Math.random() - 0.5) * 0.007,
    r:     0.5 + Math.random() * 1.6,
  }));

  function drawSparkles() {
    for (const s of sparkles) {
      s.alpha += s.speed;
      if (s.alpha <= 0.02 || s.alpha >= 0.38) s.speed *= -1;
      ctx.save();
      ctx.globalAlpha = s.alpha;
      ctx.beginPath();
      ctx.arc((s.x / 1920) * W, (s.y / 1080) * H, s.r, 0, Math.PI * 2);
      ctx.fillStyle   = `hsl(${s.hue},100%,70%)`;
      ctx.shadowColor = `hsl(${s.hue},100%,60%)`;
      ctx.shadowBlur  = 8;
      ctx.fill();
      ctx.restore();
    }
  }

  /* ═══════════════════════════════════
     DISSOLUTION PARTICLES
  ═══════════════════════════════════ */
  const dissParticles = [];

  function spawnDissolution(x, y, text, hue) {
    const count = 28 + Math.floor(text.length * 1.1);
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const spd   = 0.3 + Math.random() * 1.4;
      dissParticles.push({
        x, y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd - 0.5,
        alpha: 0.8 + Math.random() * 0.2,
        r: 1 + Math.random() * 2.5,
        hue: hue + (Math.random() - 0.5) * 40,
        life: 1,
        decay: 0.012 + Math.random() * 0.018,
      });
    }
  }

  function updateDrawDiss() {
    for (let i = dissParticles.length - 1; i >= 0; i--) {
      const p = dissParticles[i];
      p.x    += p.vx;
      p.y    += p.vy;
      p.vy   += 0.015;
      p.life -= p.decay;
      if (p.life <= 0) { dissParticles.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = p.life * p.alpha;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
      ctx.fillStyle   = `hsl(${p.hue},100%,75%)`;
      ctx.shadowColor = `hsl(${p.hue},100%,60%)`;
      ctx.shadowBlur  = 6;
      ctx.fill();
      ctx.restore();
    }
  }

  /* ═══════════════════════════════════
     REVEAL HIT-TEST
  ═══════════════════════════════════ */
  function isRevealedByPointer(el) {
    if (!el) return false;
    const r = el.getBoundingClientRect();
    const pad = isTouch ? 55 : 90;
    return mx >= r.left - pad && mx <= r.right  + pad &&
           my >= r.top  - pad && my <= r.bottom + pad;
  }

  /* ═══════════════════════════════════
     SENTENCE POOLS — emotionally grouped
  ═══════════════════════════════════ */

  // Phase 1: Boredom / arrival (0–2 min)
  const SENTENCES_BOREDOM = [
    "You opened this because something was missing.",
    "This is what boredom looks like when it breathes.",
    "You didn't know what you were looking for.",
    "The night gets quiet in a specific way.",
    "You needed somewhere to put your attention.",
    "Most people scroll. You stopped here.",
    "This is the gap between one thought and the next.",
    "You found this at the right kind of wrong time.",
    "Your mind needed somewhere to rest.",
    "Boredom is just the mind asking for more.",
  ];

  // Phase 2: Recognition / thought spiral (2–5 min)
  const SENTENCES_THOUGHT = [
    "You are thinking about something you haven't said.",
    "Some thoughts only exist when nobody's watching.",
    "The thing you keep coming back to — it matters.",
    "You stayed because something here felt familiar.",
    "This is what a thought looks like before it has words.",
    "You're not distracted. You're processing.",
    "Some people never stop to feel this.",
    "The mind in motion is always searching for something.",
    "You hover like you're deciding something.",
    "You almost left. But you didn't.",
    "There's something you've been meaning to figure out.",
    "You came for nothing and found something quieter.",
  ];

  // Phase 3: Deep presence / emotional (5–8 min)
  const SENTENCES_PRESENCE = [
    "You have been here long enough to know this matters.",
    "The lights remember every cursor that passed through.",
    "Nobody knows you are here. That's the point.",
    "Some people keep things alive just by staying.",
    "You would have paid if this were a film.",
    "A stranger already kept this alive for you.",
    "You are the reason the lights are still on.",
    "The dream only exists because someone stayed.",
    "This light costs someone something real.",
    "Staying is a form of care most people forget.",
  ];

  // Phase 4: Late / accountability (8+ min)
  const SENTENCES_LATE = [
    "You have been here long enough to owe this something.",
    "Most people left before understanding. You didn't.",
    "You stayed through the quiet and the dark.",
    "The ones who stay this long always feel it.",
    "This website remembers hesitation. And generosity.",
    "Nobody will know you were here unless you leave something.",
    "You could have done more. You still can.",
    "Someone already did. You could be next.",
    "The lights dim when nobody feeds them.",
    "You are the last one watching. Make it mean something.",
  ];

  function getSentencePool() {
    const m = sessionMinutes();
    if (m < 2)  return SENTENCES_BOREDOM;
    if (m < 5)  return [...SENTENCES_BOREDOM, ...SENTENCES_THOUGHT];
    if (m < 8)  return [...SENTENCES_THOUGHT, ...SENTENCES_PRESENCE];
    return [...SENTENCES_PRESENCE, ...SENTENCES_LATE];
  }

  let lastSentenceText = '';
  function randomSentence() {
    const pool = getSentencePool().filter(s => s !== lastSentenceText);
    const t = pool[Math.floor(Math.random() * pool.length)];
    lastSentenceText = t;
    return t;
  }

  /* ═══════════════════════════════════
     PAYMENT ENTITY SETUP
  ═══════════════════════════════════ */
  /* ═══════════════════════════════════
     PAYMENT ENTITY SETUP
  ═══════════════════════════════════ */
  const PAY_TEXTS = [
    "Keep It Alive",
    "Leave A Trace",
    "Feed The Lights",
    "Continue The Signal",
    "Stay A Little Longer",
    "Keep The Dream Breathing",
    "The Lights Remember",
    "Keep This Existing",
    "Someone Already Did",
    "Leave Something Behind",
    "You Could Still Do More",
    "Add Another Thought",
  ];

  // Contextual subtitles for the payment modal
  const PAY_SUBS = [
    "You've been here long enough to know it's real.",
    "Something kept you here. Leave a trace of light.",
    "The ones who stay always understand eventually.",
    "A stranger already did this for you once.",
    "This only exists because someone cared enough.",
    "You found it. That already means something.",
  ];

  const payEntityEl = document.createElement('div');
  payEntityEl.id = 'pay-entity-dyn';
  document.body.appendChild(payEntityEl);

  const payState = {
    x: W * 0.7,
    y: H * 0.35,
    alive: false,
  };

  function randomPayPosition() {
    const m   = W < 480 ? 44 : 90;
    const elW = Math.min(payEntityEl.offsetWidth  || 220, W * 0.72);
    const elH = payEntityEl.offsetHeight || 50;
    const safeLeft  = elW / 2 + m;
    const safeRight = W - elW / 2 - m;
    const safeTop   = elH / 2 + m + (H < 500 ? 20 : 0);
    const safeBot   = H - elH / 2 - m;
    payState.x = safeLeft + Math.random() * Math.max(20, safeRight - safeLeft);
    payState.y = safeTop  + Math.random() * Math.max(20, safeBot  - safeTop);
    payEntityEl.style.left = payState.x + 'px';
    payEntityEl.style.top  = payState.y + 'px';
  }

  /* ═══════════════════════════════════
     BUTTON PHRASE SYSTEM
     Phrases from the emotional pools rotate inside
     the button. Phrase changes trigger a dissolve
     burst into the surrounding particles.
  ═══════════════════════════════════ */
  const BTN_PHRASE_INTERVAL = 11000; // ms between rotations while idle

  let btnPhraseTimer  = null;
  let btnIsHovering   = false;
  let btnChanging     = false;
  let btnCurrentHue   = 180;

  function pauseBtnPhraseTimer() {
    if (btnPhraseTimer) { clearInterval(btnPhraseTimer); btnPhraseTimer = null; }
  }

  function startBtnPhraseTimer() {
    pauseBtnPhraseTimer();
    btnPhraseTimer = setInterval(() => {
      if (!btnIsHovering && !btnChanging) changeBtnPhrase();
    }, BTN_PHRASE_INTERVAL);
  }

  function changeBtnPhrase() {
    if (btnChanging || !payState.alive) return;
    btnChanging = true;

    // Burst particles from the button's current position
    const r  = payEntityEl.getBoundingClientRect();
    const cx = r.left + r.width  / 2;
    const cy = r.top  + r.height / 2;
    btnCurrentHue = randHue();
    spawnDissolution(cx, cy, payEntityEl.textContent, btnCurrentHue);

    // Shrink + fade out at old position
    payEntityEl.style.transition =
      'opacity 0.45s ease, transform 0.45s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease';
    payEntityEl.style.opacity   = '0';
    payEntityEl.style.transform = 'translate(-50%, -50%) scale(0.72)';

    setTimeout(() => {
      // Update text and teleport to a new random spot (while invisible)
      payEntityEl.textContent = randomSentence();
      // Disable transition so the position jump is instant (no sliding)
      payEntityEl.style.transition = 'none';
      randomPayPosition();

      // One frame later re-enable transitions and spring-pop in at the new spot
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          payEntityEl.style.transition =
            'opacity 0.85s ease, transform 1s cubic-bezier(0.34,1.56,0.64,1), color 0.4s ease, border-color 0.3s ease, box-shadow 0.3s ease';
          payEntityEl.style.opacity   = '1';
          payEntityEl.style.transform = 'translate(-50%, -50%) scale(1)';
          setTimeout(() => { btnChanging = false; }, 1050);
        });
      });
    }, 520);
  }

  // Hover: pause phrase rotation while cursor is over button
  payEntityEl.addEventListener('mouseenter', () => {
    btnIsHovering = true;
    pauseBtnPhraseTimer();
  });
  payEntityEl.addEventListener('mouseleave', () => {
    btnIsHovering = false;
    if (payState.alive) startBtnPhraseTimer();
  });
  payEntityEl.addEventListener('touchstart', () => {
    btnIsHovering = true;
    pauseBtnPhraseTimer();
  }, { passive: true });
  payEntityEl.addEventListener('touchend', () => {
    setTimeout(() => {
      btnIsHovering = false;
      if (payState.alive) startBtnPhraseTimer();
    }, 2000);
  }, { passive: true });
  payEntityEl.addEventListener('touchcancel', () => {
    btnIsHovering = false;
    if (payState.alive) startBtnPhraseTimer();
  }, { passive: true });

  // Reveal button after 20 s — smooth fast fade-in
  setTimeout(() => {
    payState.alive = true;
    payEntityEl.textContent = randomSentence();
    payEntityEl.style.pointerEvents = 'auto';
    requestAnimationFrame(() => {
      randomPayPosition();
      requestAnimationFrame(() => {
        payEntityEl.style.opacity = '1';
        startBtnPhraseTimer();
      });
    });
  }, 20000);

  /* ═══════════════════════════════════
     HOVER GLOW ON PAYMENT BUTTON
  ═══════════════════════════════════ */
  let payHoverIntensity = 0;
  let payEnergyBoost    = 0;

  function updatePayEntity() {
    if (!payState.alive || btnChanging) return;
    const isOver = isRevealedByPointer(payEntityEl);

    if (isOver) {
      payHoverIntensity = Math.min(1, payHoverIntensity + 0.018);
      payEntityEl.style.color       = `rgba(255,255,255,${0.55 + payHoverIntensity * 0.45})`;
      payEntityEl.style.borderColor = `rgba(0,200,255,${0.35 + payHoverIntensity * 0.5})`;
      payEntityEl.style.boxShadow   =
        `0 0 ${12 + payHoverIntensity * 40}px rgba(0,200,255,${0.3  + payHoverIntensity * 0.5}), ` +
        `0 0 ${40 + payHoverIntensity * 80}px rgba(0,200,255,${0.08 + payHoverIntensity * 0.25})`;
      payEnergyBoost = Math.min(1, payEnergyBoost + 0.022);
    } else {
      payHoverIntensity = Math.max(0, payHoverIntensity - 0.01);
      // Button remains hidden (black on black) when not hovered — this is the discovery game
      payEntityEl.style.color       = 'rgba(0,0,0,1)';
      payEntityEl.style.borderColor = 'rgba(0,0,0,1)';
      payEntityEl.style.boxShadow   = 'none';
      payEnergyBoost = Math.max(0, payEnergyBoost - 0.01);
    }
  }

  // Click / tap on button
  function handlePayClick(cx, cy) {
    if (!payState.alive) return;
    const r = payEntityEl.getBoundingClientRect();
    if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) {
      openPayOverlay();
    }
  }
  window.addEventListener('click',    e => handlePayClick(e.clientX, e.clientY));
  window.addEventListener('touchend', e => {
    const t = e.changedTouches[0];
    handlePayClick(t.clientX, t.clientY);
  });

  /* ═══════════════════════════════════
     PAYMENT OVERLAY
  ═══════════════════════════════════ */
  const payOverlay    = document.getElementById('pay-overlay');
  const payConfirm    = document.getElementById('pay-confirm');
  const payClose      = document.getElementById('pay-close');
  const payModalTitle = document.getElementById('pay-modal-title');
  const payModalSub   = document.getElementById('pay-modal-sub');
  const amountBtns    = document.querySelectorAll('.pay-amount-btn');
  let selectedAmount  = 1;

  amountBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      amountBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedAmount = parseInt(btn.dataset.amount);
    });
  });

  function openPayOverlay() {
    // Modal title always shows a payment CTA; button shows emotional phrases
    const titleIdx = Math.floor(Math.random() * PAY_TEXTS.length);
    payModalTitle.textContent = PAY_TEXTS[titleIdx];
    const subIdx = Math.min(Math.floor(sessionMinutes() / 2), PAY_SUBS.length - 1);
    payModalSub.innerHTML = PAY_SUBS[subIdx].replace('. ', '.<br>');
    payOverlay.classList.add('open');
  }
  payClose.addEventListener('click', () => payOverlay.classList.remove('open'));
  payOverlay.addEventListener('click', e => { if (e.target === payOverlay) payOverlay.classList.remove('open'); });

  /* ─────────────────────────────────
     PAYMENT CONFIGURATION
     Replace placeholder values with your real credentials.

     Steps (Stripe):
       1. Sign up at stripe.com
       2. Developers → API Keys → copy your Publishable Key
       3. Create a Payment Link at dashboard.stripe.com/payment-links
       4. Paste keys into PAYMENT_CONFIG below
       5. Uncomment <script src="https://js.stripe.com/v3/"> at the bottom of this file
     ───────────────────────────────── */
  const PAYMENT_CONFIG = {
    provider: 'stripe', // 'stripe' | 'lemonsqueezy' | 'gumroad' | 'custom'

    // TODO: Replace with your real Stripe Publishable Key (pk_live_... or pk_test_...)
    stripePublicKey: 'pk_live_REPLACE_WITH_YOUR_STRIPE_PUBLISHABLE_KEY',

    // TODO: Replace with your Stripe Payment Link URL
    // Create one at: dashboard.stripe.com/payment-links
    stripePaymentLink: 'https://buy.stripe.com/REPLACE_WITH_YOUR_PAYMENT_LINK',

    // Optional: per-amount Price IDs for dynamic checkout (leave commented unless needed)
    // stripePriceIds: {
    //   1: 'price_REPLACE_FOR_1_DOLLAR',
    //   3: 'price_REPLACE_FOR_3_DOLLARS',
    //   5: 'price_REPLACE_FOR_5_DOLLARS',
    // },
  };

  payConfirm.addEventListener('click', () => {
    const { provider, stripePaymentLink, stripePublicKey } = PAYMENT_CONFIG;

    if (provider === 'stripe') {
      const linkConfigured = stripePaymentLink &&
        !stripePaymentLink.includes('REPLACE_WITH');

      if (linkConfigured) {
        // Stripe Payment Link — simplest integration
        const url = new URL(stripePaymentLink);
        url.searchParams.set('client_reference_id', 'neondream');
        window.open(url.toString(), '_blank');
        payOverlay.classList.remove('open');

      } else if (typeof Stripe !== 'undefined' &&
                 !stripePublicKey.includes('REPLACE_WITH')) {
        // Full Stripe.js checkout via Price IDs
        const stripe   = Stripe(stripePublicKey);
        const priceId  = (PAYMENT_CONFIG.stripePriceIds || {})[selectedAmount];
        if (priceId) {
          stripe.redirectToCheckout({
            lineItems: [{ price: priceId, quantity: 1 }],
            mode:       'payment',
            successUrl: window.location.origin + '/?payment=success',
            cancelUrl:  window.location.href,
          }).catch(console.error);
        }
        payOverlay.classList.remove('open');

      } else {
        // Payment not yet configured — show friendly message inside the modal
        if (!document.getElementById('pay-not-ready-note')) {
          const note = document.createElement('p');
          note.id = 'pay-not-ready-note';
          note.textContent = 'Payment is being set up — check back soon.';
          note.style.cssText =
            'margin-top:18px; font-size:0.78rem; letter-spacing:0.08em; ' +
            'color:rgba(180,220,255,0.75); text-align:center; ' +
            'animation: fadeIn 0.4s ease;';
          payConfirm.insertAdjacentElement('afterend', note);
          setTimeout(() => { if (note.parentNode) note.remove(); }, 4000);
        }
        // Keep the overlay open so the user sees the message
      }
    }
  });

  /* ═══════════════════════════════════
     AUDIO SYSTEM
  ═══════════════════════════════════ */
  let audioCtx = null, masterGain = null;
  let muted = false, audioStarted = false;

  document.getElementById('mute-btn').addEventListener('click', () => {
    muted = !muted;
    if (masterGain) masterGain.gain.setTargetAtTime(muted ? 0 : 0.12, audioCtx.currentTime, 0.3);
    document.getElementById('mute-btn').textContent = muted ? '♪ UNMUTE' : '♪ MUTE';
  });

  function startAudio() {
    if (audioStarted) return;
    audioStarted = true;
    try {
      audioCtx  = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0;
      masterGain.connect(audioCtx.destination);
      masterGain.gain.setTargetAtTime(0.12, audioCtx.currentTime, 2.5);
      createDrone(55, 0.4); createDrone(110, 0.25); createDrone(165, 0.12);
      createShimmer();
    } catch(e) {}
  }

  function createDrone(freq, gain) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const g   = audioCtx.createGain();
    const filt = audioCtx.createBiquadFilter();
    osc.type = 'sine'; osc.frequency.value = freq;
    const lfo = audioCtx.createOscillator();
    const lfog = audioCtx.createGain();
    lfo.frequency.value = 0.05 + Math.random() * 0.04;
    lfog.gain.value = freq * 0.004;
    lfo.connect(lfog); lfog.connect(osc.frequency); lfo.start();
    filt.type = 'lowpass'; filt.frequency.value = 800;
    g.gain.value = gain;
    osc.connect(filt); filt.connect(g); g.connect(masterGain); osc.start();
  }

  function createShimmer() {
    if (!audioCtx) return;
    function tick() {
      if (!audioCtx || muted) { setTimeout(tick, 2000); return; }
      const osc = audioCtx.createOscillator();
      const g   = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = 880 + Math.random() * 1200;
      g.gain.setValueAtTime(0, audioCtx.currentTime);
      g.gain.linearRampToValueAtTime(0.018, audioCtx.currentTime + 0.4);
      g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 2.5);
      osc.connect(g); g.connect(masterGain); osc.start(); osc.stop(audioCtx.currentTime + 2.6);
      setTimeout(tick, 1800 + Math.random() * 3000);
    }
    setTimeout(tick, 2000);
  }

  function reactAudio() {
    if (!audioCtx || !masterGain || muted) return;
    const spd = Math.min(pointerSpeed / 40, 1);
    masterGain.gain.setTargetAtTime(0.12 + spd * 0.06, audioCtx.currentTime, 0.1);
  }

  window.addEventListener('click',      () => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); });
  window.addEventListener('touchstart', () => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }, { passive: true });

  /* ═══════════════════════════════════
     CURSOR COLOR
  ═══════════════════════════════════ */
  function updateCursorColor() {
    let bestHue = 180, bestDist = Infinity;
    for (const orb of orbs) {
      const d = Math.hypot(orb.x - mx, orb.y - my);
      if (d < bestDist) { bestDist = d; bestHue = orb.hue; }
    }
    cursorDot.style.background = `hsl(${bestHue},100%,75%)`;
    cursorDot.style.boxShadow  = `0 0 10px 3px hsl(${bestHue},100%,60%)`;
  }

  /* ═══════════════════════════════════
     SESSION GLYPH
  ═══════════════════════════════════ */
  const sessionGlyph = document.getElementById('session-glyph');
  setInterval(() => {
    const a = 0.04 + sessionIntensity() * 0.18;
    sessionGlyph.style.color = `rgba(255,255,255,${a})`;
  }, 3000);

  /* ═══════════════════════════════════
     MAIN LOOP
  ═══════════════════════════════════ */
  function loop() {
    const fade = 0.15 + Math.min(pointerSpeed / 200, 0.06);
    ctx.fillStyle = `rgba(0,0,0,${fade})`;
    ctx.fillRect(0, 0, W, H);

    drawSparkles();
    updateDrawDiss();

    const energy = payEnergyBoost + Math.min(pointerSpeed / 80, 0.5);
    for (const orb of orbs) { orb.update(energy); orb.draw(energy); }

    updatePayEntity();
    updateCursorColor();
    reactAudio();

    requestAnimationFrame(loop);
  }

  loop();

})();
</script>
