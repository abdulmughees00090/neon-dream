<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Dream — Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      min-height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
      cursor: default;
    }
    
    .offline-container {
      text-align: center;
      padding: 48px 36px;
      max-width: 500px;
      width: 88%;
      background: rgba(6,6,6,0.9);
      backdrop-filter: blur(20px);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }
    
    .offline-container::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 5px;
      background: conic-gradient(from 0deg, #ff00cc, #00ffee, #ffe566, #ff6600, #cc00ff, #ff00cc);
      z-index: -1;
      animation: spinBorder 6s linear infinite;
      opacity: 0.5;
    }
    
    .offline-container::after {
      content: '';
      position: absolute;
      inset: 1px;
      border-radius: 4px;
      background: rgba(4,4,4,0.97);
      z-index: -1;
    }
    
    @keyframes spinBorder {
      to { transform: rotate(360deg); }
    }
    
    .glyph {
      font-size: 2.5rem;
      margin-bottom: 28px;
      display: inline-block;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.3; text-shadow: 0 0 0px rgba(255,255,255,0); }
      50% { opacity: 0.8; text-shadow: 0 0 20px rgba(0,255,238,0.5); }
    }
    
    h1 {
      font-family: 'Georgia', serif;
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      font-style: italic;
      color: rgba(255,255,255,0.75);
      margin-bottom: 12px;
      font-weight: 400;
      letter-spacing: 0.02em;
    }
    
    .sub {
      font-family: Arial, sans-serif;
      font-size: clamp(0.7rem, 2vw, 0.85rem);
      color: rgba(255,255,255,0.35);
      margin-bottom: 32px;
      line-height: 1.6;
      letter-spacing: 0.08em;
    }
    
    .retry-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.55);
      padding: 12px 36px;
      border-radius: 40px;
      font-family: 'Georgia', serif;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      transition: all 0.4s;
      cursor: pointer;
    }
    
    .retry-btn:hover {
      border-color: rgba(0,255,238,0.5);
      color: rgba(255,255,255,0.88);
      box-shadow: 0 0 20px rgba(0,255,238,0.15);
    }
    
    .hint {
      margin-top: 32px;
      font-family: Arial, sans-serif;
      font-size: 0.6rem;
      color: rgba(255,255,255,0.12);
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="glyph">◈ ◈ ◈</div>
    <h1>You've drifted into the quiet zone</h1>
    <div class="sub">The connection faded.<br>But the dream remembers you.</div>
    <button class="retry-btn" onclick="location.reload()">RETURN →</button>
    <div class="hint">when the signal returns, so will the light</div>
  </div>
  
  <script>
    // Try to reconnect periodically
    setInterval(() => {
      if (navigator.onLine) {
        location.reload();
      }
    }, 5000);
  </script>
</body>
</html>
